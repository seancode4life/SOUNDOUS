<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Our Little Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Pacifico&family=Quicksand:wght@500;700&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
  /* Layout: a fixed four-act show on a plum night sky.
     Act 1 matrix-rain heart with a slow firework. Act 2 a quick-cut showcase where every photo is its
     own little scene (blurred backdrop of the photo, a polaroid with a different entrance each time,
     a typed caption). Act 3 the photo cards orbit, collapse, and explode into a heart. Act 4 his message
     and a poem. One canvas holds a moving wall of text, one the matrix rain, one the fireworks.
     This look is deliberately a single dark theme. */
  :root {
    --bg: #0a0512;
    --ink: #fdf2f7;
    --muted: #cdb3c4;
    --rose: #ff8fb1;
    --hot: #ff4f86;
    --gold: #ffd27a;
    --violet: #b69cff;
    --card: rgba(28, 12, 40, .8);
    --line: rgba(255, 255, 255, .16);
    --paper: #f7f4f0;
    --paper-ink: #34212b;
    --f-ui: "Quicksand", "Segoe UI", system-ui, -apple-system, sans-serif;
    --f-script: "Pacifico", "Brush Script MT", cursive;
    --f-hand: "Reenie Beanie", "Bradley Hand", "Segoe Print", cursive;
    --f-serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: #0a0512 radial-gradient(120% 90% at 50% 36%, #3d1346 0%, #1d0a2c 46%, #0a0512 100%) fixed;
    color: var(--ink); font: 500 1rem/1.6 var(--f-ui);
    padding: 0; overflow: hidden;
  }
  h1, h2, p { margin: 0; }
  #sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  #sky i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(70px); opacity: .32; animation: drift 26s ease-in-out infinite alternate; }
  #sky .b1 { left: -20vmax; top: -18vmax; background: radial-gradient(circle, #ff4f86, transparent 65%); }
  #sky .b2 { right: -22vmax; bottom: -22vmax; background: radial-gradient(circle, #6a5acd, transparent 65%); animation-duration: 32s; }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
  #wall, #mx, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #wall { z-index: 1; }
  #mx { z-index: 2; background: #07000d; transition: opacity 1s; }
  #fx { z-index: 3; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .eyebrow { font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; color: var(--rose); }
  .tiny { font-size: .85rem; color: var(--muted); }

  .pill {
    font: inherit; font-weight: 700; color: var(--ink); cursor: pointer;
    background: linear-gradient(180deg, rgba(255, 79, 134, .6), rgba(106, 90, 205, .5));
    border: 1.5px solid rgba(255, 255, 255, .85); border-radius: 999px; padding: .8rem 1.8rem; letter-spacing: .02em;
    box-shadow: 0 0 20px rgba(255, 79, 134, .4); transition: box-shadow .25s, transform .2s;
  }
  .pill:hover { box-shadow: 0 0 30px rgba(255, 143, 177, .65); transform: translateY(-2px); }
  .pill:active { transform: scale(.97); }
  .pill.sm { padding: .55rem 1.2rem; font-size: .9rem; }
  .fade { opacity: 0; transform: translateY(14px); transition: opacity .9s, transform .9s; pointer-events: none; }
  .fade.in { opacity: 1; transform: none; pointer-events: auto; }

  .stage { position: fixed; inset: 0; z-index: 4; }
  #veil { position: fixed; inset: 0; z-index: 20; background: #0a0512; opacity: 0; pointer-events: none; transition: opacity .45s; }

  /* act 1 */
  #s1 {
    display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center;
    padding: calc(1.2rem + env(safe-area-inset-top, 0px)) 1rem calc(2rem + env(safe-area-inset-bottom, 0px));
  }
  .hint { font-size: clamp(.85rem, 2.8vw, 1.05rem); letter-spacing: .06em; color: rgba(255, 255, 255, .88); text-shadow: 0 0 14px rgba(255, 79, 134, .7); transition: opacity .8s; }
  .stack { display: grid; gap: .6rem; justify-items: center; }
  .name {
    font: 400 clamp(3rem, 14vw, 6.4rem)/1.05 var(--f-script);
    background: linear-gradient(100deg, #ffd27a, #ff8fb1 45%, #d9a8ff); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 79, 134, .6)); animation: glow 3.4s ease-in-out infinite alternate;
  }
  @keyframes glow { to { filter: drop-shadow(0 0 30px rgba(255, 210, 122, .8)); } }
  .sub { font-size: 1.15rem; font-weight: 700; color: var(--rose); text-shadow: 0 0 14px rgba(255, 79, 134, .6); }

  /* act 2 */
  #s2 { display: grid; place-items: center; overflow: hidden; }
  .bgs { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
  .vig { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(7, 0, 13, .8) 100%); }
  .sbg { position: absolute; inset: -8%; background-size: cover; background-position: center; filter: blur(16px) saturate(1.6) brightness(.55); opacity: 0; transition: opacity .6s; }
  .sbg.in { opacity: .8; animation: sbgDrift 5s ease-out forwards; }
  @keyframes sbgDrift { from { transform: scale(1.3) translate(2%, 1%); } to { transform: scale(1.12) translate(-1%, -1%); } }
  .rays { position: absolute; inset: -30%; opacity: 0; transition: opacity .5s; background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .1) 0 5deg, transparent 5deg 10deg); -webkit-mask-image: radial-gradient(circle, #000 5%, transparent 62%); mask-image: radial-gradient(circle, #000 5%, transparent 62%); animation: spinRays 9s linear infinite; }
  .rays.in { opacity: .9; }
  @keyframes spinRays { to { transform: rotate(360deg); } }
  .prog { position: absolute; top: calc(.8rem + env(safe-area-inset-top, 0px)); left: 1rem; right: 1rem; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .15); z-index: 3; }
  .prog i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--gold), var(--hot)); transition-property: width; transition-timing-function: linear; }
  .flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; z-index: 1; mix-blend-mode: screen; }
  .counter { position: absolute; z-index: 3; left: 0; right: 0; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: .8rem; letter-spacing: .24em; font-weight: 700; color: rgba(255, 255, 255, .75); text-shadow: 0 0 12px rgba(255, 79, 134, .8); font-variant-numeric: tabular-nums; transition: opacity .3s; }
  .beat { position: relative; z-index: 2; width: 100%; height: 100%; display: grid; place-items: center; padding: 1.4rem 1rem; }
  .beat > * { grid-area: 1 / 1; }

  .word { text-align: center; line-height: 1.02; font-weight: 700; max-width: 100%; animation-duration: var(--d, 1.2s); }
  .f-sans { font-family: var(--f-ui); text-transform: uppercase; letter-spacing: .02em; font-weight: 700; }
  .f-script { font-family: var(--f-script); font-weight: 400; line-height: 1.15; }
  .word { background-image: linear-gradient(100deg, var(--c1), var(--c2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(255, 79, 134, .55)); }
  .w-slam { animation: wSlam .75s cubic-bezier(.2, .9, .3, 1) both; }
  .w-zoom { animation: wZoom 1.2s cubic-bezier(.2, .8, .3, 1) both; }
  .w-slide { animation: wSlide .7s cubic-bezier(.2, .9, .3, 1.1) both; }
  .w-flip { animation: wFlip .8s cubic-bezier(.2, .9, .3, 1.1) both; }
  .w-letters { background: none; }
  .w-letters .ch { display: inline-block; animation: wDrop .6s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(var(--i) * 55ms); background-image: linear-gradient(180deg, var(--c1), var(--c2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .w-neon { background: none; color: var(--c1); -webkit-text-fill-color: var(--c1); text-shadow: 0 0 10px var(--c1), 0 0 30px var(--c2), 0 0 60px var(--c2); animation: wNeon 1.3s steps(1) both; }
  .w-glitch { position: relative; background: none; color: #fff; -webkit-text-fill-color: #fff; filter: none; animation: wGl .9s steps(1) both; }
  .w-glitch::before, .w-glitch::after { content: attr(data-t); position: absolute; inset: 0; mix-blend-mode: screen; -webkit-text-fill-color: currentColor; }
  .w-glitch::before { color: #00e5ff; animation: glA .45s steps(2) 2; }
  .w-glitch::after { color: #ff2d7a; animation: glB .45s steps(2) 2; }
  @keyframes wSlam { 0% { opacity: 0; transform: scale(3.4); filter: blur(16px); } 38% { opacity: 1; transform: scale(.9); filter: blur(0); } 50% { transform: scale(1.07) translate(6px, -4px); } 62% { transform: scale(1) translate(-5px, 3px); } 100% { transform: scale(1); } }
  @keyframes wZoom { 0% { opacity: 0; transform: scale(.3); letter-spacing: -.15em; filter: blur(10px); } 55% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: scale(1.1); letter-spacing: .03em; } }
  @keyframes wSlide { 0% { opacity: 0; transform: translateX(-120%) skewX(-22deg); } 65% { opacity: 1; transform: translateX(4%) skewX(6deg); } 100% { transform: none; } }
  @keyframes wFlip { 0% { opacity: 0; transform: perspective(700px) rotateX(-95deg) translateY(40%); } 100% { opacity: 1; transform: perspective(700px) rotateX(0); } }
  @keyframes wDrop { 0% { opacity: 0; transform: translateY(-140%) rotate(-25deg) scale(.6); } 100% { opacity: 1; transform: none; } }
  @keyframes wNeon { 0%, 18%, 22%, 60% { opacity: .2; } 20%, 24%, 64%, 100% { opacity: 1; } }
  @keyframes wGl { 0% { opacity: 0; transform: translate(-10px, 0) skewX(10deg); } 20% { opacity: 1; transform: translate(8px, -3px); } 40% { transform: translate(-5px, 2px); } 60% { transform: translate(3px, 0); } 100% { transform: none; } }
  @keyframes glA { 0% { clip-path: inset(10% 0 60% 0); transform: translate(-6px, 0); } 100% { clip-path: inset(55% 0 10% 0); transform: translate(6px, 0); } }
  @keyframes glB { 0% { clip-path: inset(60% 0 8% 0); transform: translate(6px, 0); } 100% { clip-path: inset(8% 0 55% 0); transform: translate(-6px, 0); } }

  /* photo scene */
  .pwrap { position: relative; display: grid; place-items: center; }
  .pring { position: absolute; left: 50%; top: 50%; width: 90vmin; height: 90vmin; margin: -45vmin 0 0 -45vmin; border-radius: 50%; border: 3px solid rgba(255, 160, 195, .85); box-shadow: 0 0 40px rgba(255, 79, 134, .6), inset 0 0 40px rgba(255, 79, 134, .35); opacity: 0; animation: ringOut 1.1s .1s cubic-bezier(.1, .7, .2, 1) forwards; pointer-events: none; }
  @keyframes ringOut { from { transform: scale(.25); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
  .pcard {
    margin: 0; position: relative; background: var(--paper); padding: .7rem .7rem 0; border-radius: 4px;
    width: min(78vw, 26rem, calc((80vh - 6.5rem) * .75)); rotate: var(--tilt, -2deg);
    box-shadow: 0 28px 70px rgba(0, 0, 0, .7), 0 0 50px rgba(255, 79, 134, .38);
    animation: bob 3.4s 1.1s ease-in-out infinite alternate;
  }
  @keyframes bob { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-9px) rotate(.8deg); } }
  .pcard::before { content: ""; position: absolute; top: -.8rem; left: 50%; width: 5.5rem; height: 1.6rem; translate: -50% 0; rotate: -3deg; background: rgba(255, 210, 122, .8); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); z-index: 2; }
  .pcard .ph { position: relative; overflow: hidden; aspect-ratio: 3 / 4; background: #222; }
  .pcard img { width: 100%; height: 100%; object-fit: cover; display: block; animation: kb 5s ease-out both; }
  .pcard .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .6) 50%, transparent 65%); transform: translateX(-130%); animation: shine 1.2s .8s ease-out forwards; }
  @keyframes kb { from { transform: scale(1.02); } to { transform: scale(1.14); } }
  @keyframes shine { to { transform: translateX(130%); } }
  .cap { font: 400 clamp(1.5rem, 5.6vw, 2.15rem)/1.05 var(--f-hand); color: var(--paper-ink); text-align: center; padding: .75rem .4rem .9rem; min-height: 4.6rem; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 0 .28em; }
  .cap .wd { display: inline-block; white-space: nowrap; }
  .cap .c { display: inline-block; opacity: 0; animation: chIn .3s cubic-bezier(.2, 1.4, .4, 1) forwards; animation-delay: calc(850ms + var(--k) * 26ms); }
  .cap .dd { color: var(--hot); display: inline-block; opacity: 0; animation: chIn .4s cubic-bezier(.2, 1.6, .4, 1) forwards; animation-delay: var(--dd); }
  @keyframes chIn { from { opacity: 0; transform: translateY(9px) scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }

  /* act 3 */
  #s3 { overflow: hidden; }
  #ring { position: absolute; left: 50%; top: 42%; width: 0; height: 0; }
  #core { position: absolute; left: 0; top: 0; width: 46vmin; height: 46vmin; margin: -23vmin 0 0 -23vmin; border-radius: 50%; opacity: 0; pointer-events: none; background: radial-gradient(circle, rgba(255, 255, 255, .98), rgba(255, 143, 177, .65) 32%, transparent 70%); }
  .shock { position: absolute; left: 0; top: 0; width: 100vmin; height: 100vmin; margin: -50vmin 0 0 -50vmin; border-radius: 50%; border: 4px solid #fff; opacity: 0; pointer-events: none; animation: shock 1.3s cubic-bezier(.1, .7, .2, 1) forwards; }
  @keyframes shock { from { transform: scale(.02); opacity: .95; } to { transform: scale(1.7); opacity: 0; } }
  .rc { position: absolute; left: 0; top: 0; width: var(--cw); background: var(--paper); padding: calc(var(--cw) * .05) calc(var(--cw) * .05) 0; border-radius: 3px; box-shadow: 0 8px 22px rgba(0, 0, 0, .6); will-change: transform; transform: translate(-50%, -50%) scale(0); }
  .rc img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
  .rc span { display: block; font: 400 calc(var(--cw) * .13)/1 var(--f-hand); color: var(--paper-ink); text-align: center; padding: calc(var(--cw) * .06) 0 calc(var(--cw) * .07); min-height: calc(var(--cw) * .3); transition: opacity .3s; overflow: hidden; }
  .rc.thumb { box-shadow: 0 0 0 2px #fff, 0 0 16px rgba(255, 79, 134, .85); }
  .rc.thumb span { opacity: 0; }
  .rc.landed { animation: landed .8s ease-out; }
  @keyframes landed { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .95), 0 0 0 rgba(255, 79, 134, 0); } 55% { box-shadow: 0 0 0 9px rgba(255, 255, 255, 0), 0 0 34px rgba(255, 79, 134, 1); } 100% { box-shadow: 0 0 0 2px #fff, 0 0 16px rgba(255, 79, 134, .85); } }
  .final { position: absolute; left: 0; right: 0; bottom: calc(1.6rem + env(safe-area-inset-bottom, 0px)); display: grid; gap: 1.1rem; justify-items: center; text-align: center; padding-inline: 1rem; }
  .love { font: 400 clamp(1.9rem, 8vw, 3.8rem)/1.2 var(--f-script); text-wrap: balance; background: linear-gradient(100deg, #ffd27a, #ff8fb1 50%, #d9a8ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 20px rgba(255, 79, 134, .65)); }
  .love .w { display: inline-block; opacity: 0; margin-inline: .12em; }
  .love.in .w { animation: pop .8s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: calc(var(--i) * .2s); }
  @keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.6); } to { opacity: 1; transform: none; } }

  /* act 4: message and poem */
  #s4 { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(1.2rem + env(safe-area-inset-top, 0px)) 1rem calc(2.5rem + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; align-content: start; }
  .pbox { width: min(100%, 34rem); display: grid; gap: 1.5rem; margin-block: auto; }
  .bubble { display: grid; gap: .55rem; padding: 1.2rem 1.3rem; font-size: 1.08rem; line-height: 1.55; background: var(--card); border: 1px solid var(--line); border-radius: 24px 24px 24px 6px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 14px 40px rgba(0, 0, 0, .45); }
  .bubble p { margin: 0; min-height: 1.55em; }
  .poem {
    position: relative; text-align: center; padding: 2.2rem 1.4rem 2rem; border-radius: 28px;
    background: linear-gradient(180deg, rgba(44, 18, 58, .86), rgba(24, 10, 36, .86)); border: 1px solid rgba(255, 210, 122, .38);
    box-shadow: 0 0 70px rgba(255, 79, 134, .28), 0 24px 60px rgba(0, 0, 0, .55);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    opacity: 0; transform: translateY(26px) scale(.97); transition: opacity 1.1s, transform 1.1s; pointer-events: none;
  }
  .poem.in { opacity: 1; transform: none; pointer-events: auto; }
  .ptitle { margin-top: .3rem; font: 400 clamp(2.1rem, 9vw, 3.1rem)/1.15 var(--f-script); background: linear-gradient(100deg, #ffd27a, #ff8fb1 55%, #d9a8ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 16px rgba(255, 79, 134, .5)); }
  .stanza { margin-top: 1.5rem; display: grid; gap: .1rem; }
  .pl { margin: 0; font: italic 500 clamp(1.3rem, 4.8vw, 1.7rem)/1.5 var(--f-serif); color: #fff; text-shadow: 0 0 18px rgba(255, 143, 177, .35); }
  .pl .pwd { display: inline-block; opacity: 0; }
  .stanza.show .pwd { animation: pwIn .8s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--d) * 1ms); }
  @keyframes pwIn { from { opacity: 0; filter: blur(9px); transform: translateY(12px) scale(.96); } to { opacity: 1; filter: blur(0); transform: none; } }
  .psig { margin-top: 1.6rem; font: 400 1.6rem/1.2 var(--f-script); color: var(--gold); }
  .prow { display: flex; gap: .7rem; justify-content: center; flex-wrap: wrap; }

  /* note overlay */
  #end { position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: rgba(8, 3, 14, .86); padding: 1.5rem 1rem 2.5rem; display: grid; place-items: center; }
  .endin { width: min(100%, 34rem); display: grid; gap: 1.2rem; margin-block: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 1.8rem 1.4rem; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); display: grid; gap: 1rem; text-align: center; }
  .card h2 { font-size: 1.55rem; line-height: 1.2; color: var(--rose); text-wrap: balance; }
  .card h2 .heart { color: var(--hot); }
  .note p { text-align: left; }
  .note .sig { text-align: right; font-style: italic; color: var(--gold); transition: opacity .8s; }
  .caret::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 3px; background: currentColor; vertical-align: -.15em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .count { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; }
  .tick { border-top: 2px solid var(--hot); padding-top: .5rem; }
  .tick b { display: block; font: 400 clamp(1.7rem, 8vw, 2.5rem)/1 var(--f-script); font-variant-numeric: tabular-nums; color: var(--gold); }
  .tick span { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
  .row { display: flex; gap: .7rem; justify-content: center; flex-wrap: wrap; }

  @media (prefers-reduced-motion: reduce) {
    #sky i, .name, .pcard, .rays { animation: none; }
    .word, .word .ch, .pcard img, .cap .c, .cap .dd, .pring, .pcard .ph::after { animation-duration: .01s !important; animation-delay: 0s !important; }
    .w-glitch::before, .w-glitch::after { animation: none; }
    .stanza.show .pwd { animation-duration: .01s; animation-delay: 0s; }
    .pill, .fade, .poem { transition: none; }
    .caret::after { animation: none; }
  }
</style>

<div id="sky" aria-hidden="true"><i class="b1"></i><i class="b2"></i></div>
<canvas id="wall" aria-hidden="true"></canvas>
<canvas id="mx" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <!-- Act 1: matrix heart -->
  <section class="stage" id="s1" aria-label="A heart for Soundous">
    <p class="hint" id="hint1">wait for it, bby :3</p>
    <div class="stack">
      <h1 class="name">Soundous</h1>
      <p class="sub fade" id="sub1">I made you something ♥</p>
      <button class="pill fade" id="cont" type="button">Continue ♥</button>
    </div>
  </section>

  <!-- Act 2: showcase -->
  <section class="stage" id="s2" aria-label="Showcase" hidden>
    <div class="bgs" id="bgs" aria-hidden="true"></div>
    <div class="vig" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="prog" aria-hidden="true"><i id="prog"></i></div>
    <div class="beat" id="beat"></div>
    <p class="counter" id="counter" aria-hidden="true"></p>
  </section>

  <!-- Act 3: finale -->
  <section class="stage" id="s3" aria-label="I love you my beautiful girl" hidden>

          if (!fin.landed[i]) {
            fin.landed[i] = 1; c.classList.add('landed');
            if (!reduced) ball(fin.cx + ex, fin.cy + ey, 8, 2.4 * U(), { hue: 340, hv: 30, l: 85, tw: 1, lmin: 30, lmax: 55, g: 0.03, drag: 0.95 });
          }
        }
      }
      c.style.transform = 'translate(-50%,-50%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + rr.toFixed(3) + 'rad) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';
      c.style.zIndex = z; c.style.opacity = op;
      c.style.filter = blur > 0.15 ? 'blur(' + blur.toFixed(1) + 'px)' : 'none';
    }
  }
  $('noteBtn').addEventListener('click', function () { go(4); });

  /* act 4: message and poem */
  function typeLines(box, lines, speed, done) {
    var i = 0, j = 0, p = null;
    box.innerHTML = '';
    lines.forEach(function (t) { var el = document.createElement('p'); el.setAttribute('data-full', t); box.appendChild(el); });
    var ps = [].slice.call(box.children);
    if (reduced) { ps.forEach(function (el) { el.textContent = el.getAttribute('data-full'); }); done(); return; }
    (function step() {
      if (i >= ps.length) { done(); return; }
      p = ps[i]; p.classList.add('caret');
      var full = p.getAttribute('data-full');
      if (j < full.length) {
        var ch = full.charAt(j++);
        p.textContent += ch;
        later(step, /[.,!?]/.test(ch) ? speed * 5 : speed);
      } else { p.classList.remove('caret'); i++; j = 0; later(step, 520); }
    })();
  }
  function startPoem() {
    var bub = $('bubble'), poem = $('poem'), st = $('stanzas');
    st.innerHTML = ''; bub.innerHTML = ''; poem.classList.remove('in');
    $('psig').classList.remove('in'); $('prow').classList.remove('in'); s4.scrollTop = 0;
    POEM.forEach(function (lines) {
      var s = document.createElement('div'), wi = 0;
      s.className = 'stanza';
      s.setAttribute('data-dur', String(lines.length * 760 + 1500));
      lines.forEach(function (l, li) {
        var p = document.createElement('p');
        p.className = 'pl';
        p.innerHTML = l.split(' ').map(function (w) { return '<span class="pwd" style="--d:' + (li * 760 + (wi++) * 90) + '">' + w + '</span>'; }).join(' ');
        wi = 0;
        s.appendChild(p);
      });
      st.appendChild(s);
    });
    rain = true;
    function reveal(i) {
      var el = st.children[i];
      if (!el) {
        later(function () { $('psig').classList.add('in'); fire(HEART_ID, W / 2, H * 0.3, { sc: 1.3 }); }, 700);
        later(function () { $('prow').classList.add('in'); }, 2200);
        return;
      }
      el.classList.add('show');
      if (el.scrollIntoView) el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
      if (!reduced) sideFire(0.9);
      later(function () { reveal(i + 1); }, +el.getAttribute('data-dur'));
    }
    later(function () {
      typeLines(bub, MSG, 32, function () {
        later(function () { poem.classList.add('in'); later(function () { reveal(0); }, 1400); }, 900);
      });
    }, 700);
  }
  $('replay2').addEventListener('click', function () { go(1); });

  /* taps for extra sparkles once the heart is up */
  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button, #end')) return;
    if ((stage === 1 && mHeart.on) || (stage === 3 && fin.exploded)) fire(pick(AMB), e.clientX, e.clientY, { sc: 0.9 });
  });

  /* ---------- Note overlay ---------- */
  var endEl = $('end'), msg = $('msg'), sig = $('sig'), typed = false;
  NOTE.forEach(function (t) { var p = document.createElement('p'); p.textContent = t; msg.appendChild(p); });
  sig.textContent = SIGNATURE;
  $('srmsg').textContent = NOTE.join(' ') + ' ' + SIGNATURE;
  function typeNote() {
    if (reduced) return;
    var ps = [].slice.call(msg.children), full = ps.map(function (p) { return p.textContent; }), i = 0, j = 0;
    ps.forEach(function (p) { p.textContent = ''; });
    sig.style.opacity = '0';
    (function step() {
      if (i >= ps.length) { sig.style.opacity = '1'; return; }
      var p = ps[i]; p.classList.add('caret');
      if (j < full[i].length) {
        var ch = full[i].charAt(j++);
        p.textContent += ch;
        setTimeout(step, /[.,!?]/.test(ch) ? 200 : 34);
      } else { p.classList.remove('caret'); i++; j = 0; setTimeout(step, 380); }
    })();
  }
  $('openNote').addEventListener('click', function () { endEl.hidden = false; if (!typed) { typed = true; typeNote(); } });
  $('closeEnd').addEventListener('click', function () { endEl.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !endEl.hidden) endEl.hidden = true; });

  function bday() {
    var n = new Date(), y = n.getFullYear(), today = n.getMonth() === 8 && n.getDate() === 21, t = new Date(y, 8, 21);
    if (!today && n >= t) t = new Date(y + 1, 8, 21);
    if (today) {
      $('bdayhead').textContent = 'Happy Birthday, Soundous! ♥'; $('bnote').textContent = 'today is all yours, mommy :3';
      ['bd', 'bh', 'bm', 'bs'].forEach(function (id) { $(id).textContent = '0'; });
      return;
    }
    var s = Math.max(0, Math.floor((t - n) / 1000));
    $('bd').textContent = Math.floor(s / 86400);
    $('bh').textContent = String(Math.floor(s % 86400 / 3600)).padStart(2, '0');
    $('bm').textContent = String(Math.floor(s % 3600 / 60)).padStart(2, '0');
    $('bs').textContent = String(s % 60).padStart(2, '0');
  }
  bday(); setInterval(bday, 1000);

  /* ---------- Start ---------- */
  resize();
  window.addEventListener('resize', resize);
  var fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('700 40px Quicksand') : Promise.resolve();
  Promise.race([fontReady, new Promise(function (r) { setTimeout(r, 1500); })]).then(function () { ptsCache = {}; buildWall(); });
  mOn = true; startStage1();
  requestAnimationFrame(frame);
})();
</script>
